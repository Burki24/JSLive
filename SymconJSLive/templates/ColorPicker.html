<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    {VIEWPORT} <!-- Dont Remove this line, it can be disabled at intstance! -->
    <title>ColorPicker</title>
    <style>#picker { line-height: 0; } #picker .IroColorPicker { display: inline-block !important; white-space: nowrap; }</style>
</head>
<script src="/hook/JSLive/js/jquery/4.0.0/jquery.min.js"></script>
<script src="/hook/JSLive/js/util.js"></script>
<script src="/hook/JSLive/js/iro/5.5.0/iro.js"></script>



<body style="text-align: center;">
<div id="picker"></div>
<div id="picker-status" role="status"></div>

<script>
    let config_global = {GLOBAL};
    let config_variabels = {VARIABELS};
    let config_layout = {LAYOUT};
    let configuration = {CONFIG};
    let writeError = '';

    let colorPicker = new iro.ColorPicker("#picker",  LoadPicker());
    JSLiveObserveSize(ResizePicker);

    let last_update = Date.now();
    let last_changes = [];
    let updateId = [];
    let updateVal = [];
    let running = false;
    let refreshPromise = null;
    let refreshPending = false;
    let inputRevision = 0;

    function LoadPicker(){

            var laydata = GenerateLayoutData();
            var wdh = Get_WindowHeight() - 20;

            if (wdh > Get_WindowWidth()) {
                wdh = Get_WindowWidth() - 20;
            }

            if (configuration.manWidth > 0) {
                wdh = configuration.manWidth;
            }

            //alert("Breite: " + wdh);

            if (configuration.layout_Direction === "vertical") {
                wdh = wdh - laydata.width_s;

                if (laydata.counter_wheelbox > 0) {
                    wdh = (wdh / laydata.counter_wheelbox) - (laydata.counter_wheelbox * 10);
                }
            }

            if (!(configuration.manWidth > 0)) wdh = PickerWidth(laydata);

            config = {
                layoutDirection: configuration.layout_Direction,
                layout: laydata.output,
                colors: GenerateColorData(),
                width: wdh,
                borderColor: configuration.style_borderColor,
                borderWidth: configuration.style_borderWidth,
                handleRadius: configuration.style_handleRadius
                //handleSvg: '#handle',
                //handleProps: {x: -8, y: -20}

            };

            //config = {};

            return config;
        try {
        }catch (e){
            alert("Colorpicker | ",e);
        }
    }

    function PickerWidth(layout) {
        const horizontal = configuration.layout_Direction === 'horizontal';
        const width = Math.max(1, Get_WindowWidth() - 20);
        const height = Math.max(1, Get_WindowHeight() - 20);
        // iro uses a 12px margin between components, in either direction.
        const fixed = layout.output.reduce(function (sum, part) {
            if (part.component !== iro.ui.Slider || part.options.sliderShape === 'circle') return sum;
            return sum + (part.options.sliderSize == null ? 12 + 2 * configuration.style_handleRadius : part.options.sliderSize);
        }, 0) + Math.max(0, layout.output.length - 1) * 12;
        const primary = horizontal ? width : height;
        const cross = horizontal ? height : width;
        return Math.max(1, Math.floor(Math.min(cross, layout.counter_wheelbox > 0
            ? (primary - fixed) / layout.counter_wheelbox : cross)));
    }

    function ResizePicker() {
        // Explicit picker widths remain an owner-controlled layout override.
        if (configuration.manWidth > 0) return;
        colorPicker.resize(PickerWidth(GenerateLayoutData()));
    }

    function GenerateLayoutData(){
        var output = [];
        var width_s = 0;
        var counter_wheelbox = 0;

        config_layout.forEach(function (part, index){
            item = {};
            options = {};

            switch(part.Layout){
                default:
                case "Wheel":
                    item["component"] = iro.ui.Wheel;
                    options["wheelLightness"] = configuration.wheel_Lightness;
                    options["wheelAngle"] = configuration.wheel_Angle;
                    options["wheelDirection"] = configuration.wheel_Direction;
                    counter_wheelbox++;
                    break;
                case "Box":
                    item["component"] = iro.ui.Box;
                    counter_wheelbox++;
                    break;
                case "Slider":
                    item["component"] = iro.ui.Slider;
                    if(part.sliderShape === "circle"){
                        counter_wheelbox++;
                    }else{
                        width_s = width_s + part.sliderSize + 10;
                    }


                    options["sliderType"] = part.sliderType;
                    options["sliderSize"] = part.sliderSize;
                    options["sliderShape"] = part.sliderShape;
                    break;
            }
            item["component"]

            item["options"] = options;
            output.push(item);
        });

        if(output.length === 0){
            //add default!
            //Wheel
            item = {};
            options = {};

            item["component"] = iro.ui.Wheel;
            output.push(item);
            counter_wheelbox++;

            //silder Value
            item = {};
            options = {};

            item["component"] = iro.ui.Slider;
            options["sliderType"] = "value";
            options["sliderSize"] = 40;
            item["options"] = options;
            output.push(item);
            width_s = width_s + 40 + 10;
        }

        return {"output": output, "width_s": width_s, "counter_wheelbox": counter_wheelbox};
    }

    function GenerateColorData(){
        var output = [];
        const errors = [];

        config_variabels.forEach(function (part, index){
            if(part.Variable === 0){
                output.push('#000000');
                console.log(Date.now() + " >> GenerateColorData | Überspinge Farbe => keine Variable gesetzt!");
            }else{
                switch(part.Mode) {
                    case "xy":
                        // The server uses Symcon's color space conversion, never a browser guess.
                        output.push(hexToRgb(Number.isInteger(part.ColorValue) ? part.ColorValue : 0));
                        if (part.Error) errors.push(part.Variable + ': ' + part.Error);
                        break;
                    case "color":
                        output.push(hexToRgb(part.Value));
                        break;
                    case "kelvin":
                        temp = part.Value;
                        output.push(colorTemperatureToRGB(temp));
                        break;
                    case "mired":
                        temp = part.Value;
                        temp = MiredToKelvin(temp);
                        output.push(colorTemperatureToRGB(temp));
                        break;
                    default:
                        output.push('#000000'); // Keep handle indices aligned with the datasets.
                        console.log(Date.now() + " >> GenerateColorData | Überspinge "+part.Variable+" falscher Modus => " + part.Mode);
                        break
                }
            }
        });

        document.getElementById('picker-status').textContent = [writeError, ...errors].filter(Boolean).join(' ');
        return output;
    }

    // iro emits input:change only for user input, unlike color:change/setColors.
    colorPicker.on('input:change', function(color) {
        console.log(Date.now() + " >> ChangeColor (" + color.index + ") => " + color.rgb);

        const dataset = config_variabels[color.index];
        if (!dataset || !dataset.Variable || (dataset.Mode === 'xy' && !Number.isInteger(dataset.ColorValue))) return;
        writeError = '';
        inputRevision++;
        const id = dataset.Variable;
        let val;

        switch(dataset.Mode) {
            case "xy":
            case "color":
                val = hexToInt(color.rgb);
                break;
            case "kelvin":
                val = color.kelvin;
                break;
            case "mired":
                val = color.kelvin;
                val = KelvinToMired(val);
                break;
            default:
                return;
        }

        if (dataset.Mode === 'xy') dataset.ColorValue = val;
        else dataset.Value = val;


        if(updateId.includes(id)){
            //updaten
            const index = updateId.indexOf(id);
            updateVal[index] = val;
        }else{
            //anlegen
            updateId.push(id);
            updateVal.push(val);
        }

        console.log(Date.now() + " >> ChangeColor => "+ JSON.stringify(updateVal));

        if(!running) UpdateWorker();
    });

    async function UpdateWorker(){
        running = true;
        try {
            while (updateId.length) {
                await sleep(Math.max(1, last_update + configuration.DataUpdateRate - Date.now()));
                last_update = Date.now();
                // Detach the batch before awaiting I/O; new edits stay in the next batch.
                const ids = updateId.splice(0), values = updateVal.splice(0);
                for (let i = 0; i < ids.length; i++) {
                    try {
                        const response = await fetch('/hook/JSLive/setData?Instance={INSTANCE}&pw={PASSWORD}&var='
                            + encodeURIComponent(ids[i]) + '&val=' + encodeURIComponent(values[i]));
                        if (!response.ok || (await response.text()).trim() !== 'OK') throw new Error('Color update failed');
                        last_changes.push({var: ids[i], val: values[i], date: new Date()});
                    } catch (error) {
                        writeError = (configuration.ColorUpdateError || 'Color update failed') + ' (' + ids[i] + ')';
                        document.getElementById('picker-status').textContent = writeError;
                    }
                }
            }
        } finally {
            running = false;
            // Read back the actual xy coordinates after gamut clipping/device feedback.
            if (refreshPending || config_variabels.some(part => part.Mode === 'xy')) RefreshColorData().catch(console.error);
        }
    }

    function connect() {
        let location = window.detectLocation();
        var ws = new WebSocket(location['protocol'].replace(/^http/, 'ws') + "//" + location['host'] + "/hook/JSLive/WS/" + {INSTANCE});
        ws.onopen = function() {
            // subscribe to some channels
            //ws.send(JSON.stringify({
            //.... some message the I must send when I connect ....
            //}));
        };

        ws.onmessage = function(e) {
            data = JSON.parse(e.data);
            if(data.Message == 10506) {
                //refresh webseite
                setTimeout(function (){
                    window.location.reload(false);
                },1000);
            } else if(data.Message == 10603) {
                if (config_variabels.some(part => part.Variable === data.SenderID && part.Mode === 'xy')) {
                    RefreshColorData().catch(console.error);
                } else {
                    UpdateColorPicker(data.SenderID, data.Data[0]);
                }
            }
        };

        ws.onclose = function(e) {
            console.log(Date.now() + ' >> Socket is closed. Reconnect will be attempted in 1 second.', e.reason);
            setTimeout(function() {
                connect();
            }, 1000);
        };

        ws.onerror = function(err) {
            console.error(Date.now() + ' >> Socket encountered error: ', err.message, 'Closing socket');
            ws.close();
        };
    }

    function UpdateColorPicker(id_val, val, colorValue, error){
        isUpdated = false;
        now = Date.now();
        if(running ) return;

        //ignore color update form this Device
        var itemFound = false;
        var remDate = new Date();
        remDate.setSeconds(remDate.getSeconds() - 15);
        last_changes.forEach(function (itm, index) {
            if(itemFound) return;

            if(itm.date <= remDate){
                last_changes.splice(index, 1);
                return;
            }

            if(itm.var === id_val){
                //lösche ältere einträge
                if(itm.val === val){
                    itemFound = true
                    return;
                }

                //remove Item
                last_changes.splice(index, 1);
            }
        });

        if(itemFound && colorValue === undefined) {
            return;
        }

        required = {Variable: id_val};
        results = [];
        results = getMatchingKeys(config_variabels, required);
        if(results.length > 0){
            //änderung farbe
            index = results[0];

            if(config_variabels[index].Value !== val || (config_variabels[index].Mode === 'xy'
                && (config_variabels[index].ColorValue !== colorValue || config_variabels[index].Error !== error))){
                console.log(Date.now() + " >> UpdateColorPicker (Color)" + index + " => " + val + " (" + config_variabels[index].Value + ")");
                config_variabels[index].Value = val;
                if (config_variabels[index].Mode === 'xy') {
                    config_variabels[index].ColorValue = colorValue;
                    config_variabels[index].Error = error || '';
                }
                isUpdated = true;
            }
        }

        if(isUpdated){
            const activeIndex = colorPicker.color ? colorPicker.color.index : 0;
            colorPicker.setColors(GenerateColorData());
            if (colorPicker.colors[activeIndex]) colorPicker.setActiveColor(activeIndex);
        }
    }

    async function RefreshColorData() {
        refreshPending = true;
        if (running || refreshPromise) return refreshPromise;
        refreshPromise = (async function () {
            do {
                refreshPending = false;
                const revision = inputRevision;
                const response = await fetch('/hook/JSLive/getData?Instance={INSTANCE}&pw={PASSWORD}');
                if (!response.ok) throw new Error('Color read failed');
                const data = await response.json();
                if (running) { refreshPending = true; return; }
                if (revision !== inputRevision) { refreshPending = true; continue; }
                data.forEach(part => UpdateColorPicker(part.Variable, part.Value, part.ColorValue, part.Error));
            } while (refreshPending);
        })();
        try { await refreshPromise; }
        finally { refreshPromise = null; }
    }

    async function PullNewData(refreshRate){
        refreshRate = refreshRate * 1000;
        while (true){
            try {
                await RefreshColorData();

                //Control Variables
            }catch (e) {
                console.log(Date.now() + " >> PullNewData => ", e);
            }
            await sleep(refreshRate);
        }
    }

    window.onload = function() {
        try {
            if (config_global.LocalAddress == "" && config_global.LocalDataMode == 0) {
                //pullup Mode local
                refreshRate = config_global.LocalRefreshTime;
                PullNewData(refreshRate);
            } else if (config_global.RemoteAddress == "" && config_global.RemoteDataMode == 0) {
                //pullup Mode remote
                refreshRate = config_global.RefreshTime;
                PullNewData(refreshRate);
            } else {
                connect();
            }
        }catch (e) {
            alert("Colorpicker | ", e);
        }
    }
</script>
</body>
</html>
